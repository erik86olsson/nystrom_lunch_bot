name: Lunch Notification

on:
  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * 1-5'

jobs:
  run:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python lunch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
